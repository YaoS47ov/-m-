/* ==================== 游戏状态 ==================== */
let sanity = 100;
let level = 1;
let monsterHp = 0;
let gameOver = false;
let isRolling = false;

const logEl = document.getElementById("log");
const buttonsEl = document.getElementById("buttons");
const diceArea = document.getElementById("diceArea");
const dice1 = document.getElementById("dice1");
const diceResult = document.getElementById("diceResult");

/* ==================== 工具函数 ==================== */
function updateStatus() {
  const sEl = document.getElementById("status");
  let extra = "";
  if (sanity <= 20 && sanity > 0) extra = " <span style='color:#ff7eb3'>【理智濒临崩溃，身体渴望被使用】</span>";
  else if (sanity <= 40) extra = " <span style='color:#ffb6d9'>【理智低落，更容易沉沦】</span>";
  sEl.innerHTML = `<span>理智值：<strong style="color:#ff7eb3">${sanity}</strong>${extra}</span><span>关卡：<strong>${level}</strong> / 10</span>`;
}

function addLog(text) {
  logEl.textContent += "\n\n" + text;
  logEl.scrollTop = logEl.scrollHeight;
}

function clearButtons() {
  buttonsEl.innerHTML = "";
}

function addButton(text, onClick, className = "") {
  const btn = document.createElement("button");
  btn.textContent = text;
  if (className) btn.className = className;
  btn.onclick = onClick;
  buttonsEl.appendChild(btn);
}

function setButtonsDisabled(disabled) {
  const btns = buttonsEl.querySelectorAll("button");
  btns.forEach(b => b.disabled = disabled);
}

function random(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function getSuccessThreshold() {
  const penalty = Math.floor((100 - sanity) / 10);
  return 8 + penalty;
}

/* ==================== 骰子动画 ==================== */
function rollDiceAnimation(threshold, callback) {
  return new Promise(resolve => {
    isRolling = true;
    setButtonsDisabled(true);
    diceArea.classList.add("show");
    dice1.classList.add("rolling");
    diceResult.textContent = "投掷中……";
    diceResult.className = "dice-result";

    let count = 0;
    const maxCount = 18 + random(0, 8);
    const interval = setInterval(() => {
      dice1.textContent = random(1, 20);
      count++;
      if (count >= maxCount) {
        clearInterval(interval);
        const final = random(1, 20);
        dice1.textContent = final;
        dice1.classList.remove("rolling");
        
        const success = final >= threshold;
        if (success) {
          diceResult.textContent = `结果：${final} ≥ ${threshold}　判定成功！`;
          diceResult.className = "dice-result success";
        } else {
          diceResult.textContent = `结果：${final} < ${threshold}　判定失败……`;
          diceResult.className = "dice-result fail";
        }

        setTimeout(() => {
          isRolling = false;
          setButtonsDisabled(false);
          callback(final, success);
          resolve();
        }, 900);
      }
    }, 70);
  });
}

/* ==================== 游戏流程 ==================== */
function showStart() {
  clearButtons();
  diceArea.classList.remove("show");
  addLog("请选择行动：");
  addButton("进入第1关（黏液史莱姆）", () => startBattle(1));
  addButton("直接主动臣服（理智清零）", () => submitNow(), "danger");
}

function startBattle(lv) {
  level = lv;
  const m = monsters[level];
  monsterHp = m.hp;
  gameOver = false;
  diceArea.classList.remove("show");
  addLog(`【第 ${level} 关】\n出现了【${m.name}】！\n魔物生命：${monsterHp}\n\n你感到心跳加速，呼吸微微发烫。下腹涌起熟悉的、既恐惧又期待的热意……`);
  updateStatus();
  showBattleOptions();
}

function showBattleOptions() {
  clearButtons();
  const threshold = getSuccessThreshold();
  addButton(`全力攻击（需 ≥ ${threshold}）`, () => playerAction("attack"));
  addButton(`防御反击（需 ≥ ${threshold - 2}）`, () => playerAction("defend"));
  addButton("主动求饶（扣除理智）", () => beg());
  addButton("直接臣服（理智清零）", () => submitNow(), "danger");
}

function playerAction(type) {
  if (gameOver || isRolling) return;

  const isAttack = type === "attack";
  const threshold = isAttack ? getSuccessThreshold() : Math.max(5, getSuccessThreshold() - 2);

  addLog(`你选择了${isAttack ? "全力攻击" : "防御反击"}，开始投掷判定骰……`);

  rollDiceAnimation(threshold, (dice, success) => {
    if (success) {
      const dmg = isAttack ? random(16, 32) : random(10, 20);
      monsterHp -= dmg;
      addLog(`判定成功！你造成了 ${dmg} 点伤害。\n魔物剩余生命：${Math.max(0, monsterHp)}`);

      if (monsterHp <= 0) {
        addLog(`\n你成功击败了【${monsters[level].name}】！\n\n${monsters[level].win}`);
        showWinOptions();
        return;
      }
    } else {
      addLog(`判定失败……你的动作出现破绽，露出了防守的空隙。`);
    }

    // 魔物反击
    setTimeout(() => {
      const dodgeThreshold = 12 + Math.floor((100 - sanity) / 15);
      const monsterDice = random(1, 20);
      if (monsterDice >= dodgeThreshold) {
        const loss = monsters[level].atk + random(-2, 4);
        sanity = Math.max(0, sanity - loss);
        addLog(`魔物的攻击命中了你！理智减少 ${loss} 点。`);
        updateStatus();
        if (sanity <= 0) {
          lose();
          return;
        }
      } else {
        addLog(`你勉强躲开了魔物的反击。`);
      }
      showBattleOptions();
    }, 400);
  });
}

function beg() {
  if (gameOver || isRolling) return;
  const loss = random(12, 22);
  sanity = Math.max(0, sanity - loss);
  addLog(`你主动示弱，用软绵绵、带着哭腔的声音求饶。\n理智减少了 ${loss} 点。\n魔物的眼神明显变得玩味而兴致高昂起来……`);
  updateStatus();
  if (sanity <= 0) {
    lose();
  } else {
    showBattleOptions();
  }
}

function submitNow() {
  if (gameOver || isRolling) return;
  sanity = 0;
  updateStatus();
  const m = monsters[level] || monsters[1];
  addLog(`你主动跪了下来，彻底放下所有抵抗与骄傲。\n双腿分开，双手放在膝上，用最顺从的姿态等待被使用。\n\n${m.lose}\n\n理智已清零。\n你成为了它的所有物。\n\n—— 游戏结束 ——`);
  gameOver = true;
  diceArea.classList.remove("show");
  clearButtons();
  addButton("重新开始", restart, "info");
}

function lose() {
  const m = monsters[level];
  addLog(`理智归零！\n身体彻底软了下来，再也提不起任何反抗的念头。\n\n${m.lose}\n\n你彻底臣服，成为了它的专属玩具与泄欲对象。\n\n—— 游戏结束 ——`);
  gameOver = true;
  diceArea.classList.remove("show");
  clearButtons();
  addButton("重新开始", restart, "info");
}

function showWinOptions() {
  clearButtons();
  diceArea.classList.remove("show");
  addButton("斩杀它，继续前进", () => nextLevel("你干净利落地结束了它的生命。剑尖还残留着它的气息，身体却因为刚才的战斗而微微发热，下腹涌起一丝空虚。"), "win");
  addButton("支配它，让它服侍你", () => nextLevel("你成功支配了它。它温顺地待在你身边，用完全服从的姿态等待你的下一个命令。你第一次体会到「掌控」带来的另一种快感。"), "win");
  addButton("放过它，进入下一关", () => nextLevel("你选择放过它。它退到一旁，用复杂的眼神看着你离开。你继续向更深的地方走去，心跳却比刚才更快了一些。"), "win");
}

function nextLevel(msg) {
  addLog(msg);
  level++;
  if (level > 10) {
    addLog("\n★★★ 恭喜通关全部十关！★★★\n你成功挑战了堕落森林最深处的所有魔物。\n你证明了自己既是能够战胜强敌的强者，也是自愿沉沦于快感与臣服的女M。\n\n在离开森林时，你回头看了一眼，嘴角带着满足的弧度。\n\n—— 游戏完美结束 ——");
    gameOver = true;
    clearButtons();
    addButton("重新开始", restart, "info");
    return;
  }
  const recover = random(6, 14);
  sanity = Math.min(100, sanity + recover);
  addLog(`（战斗胜利，理智恢复了 ${recover} 点）`);
  updateStatus();
  setTimeout(() => startBattle(level), 600);
}

function restart() {
  sanity = 100;
  level = 1;
  monsterHp = 0;
  gameOver = false;
  isRolling = false;
  diceArea.classList.remove("show");
  logEl.textContent = "游戏重新开始。\n\n你是一名自愿的女M冒险者。\n带着对被强大存在彻底使用与调教的渴望，你再次踏入「堕落森林」。\n\n攻击与防御需要骰子判定，理智越低成功率越低。\n每个魔物都有独特而细致的战胜与败北剧情。";
  updateStatus();
  showStart();
}

/* 初始化 */
updateStatus();
showStart();
